
<template>
    <lightning-modal-header
        label="Nueva solicitud de soporte">
    </lightning-modal-header>

    <lightning-modal-body>
        <lightning-record-edit-form
            object-api-name="Support_Request__c"
            onsuccess={handleSuccess}
            onerror={handleError}>

            <lightning-messages></lightning-messages>

            <lightning-input-field
                field-name="Subject__c"
                required>
            </lightning-input-field>

            <lightning-input-field
                field-name="Description__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Status__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Priority__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Account__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Assigned_To__c">
            </lightning-input-field>

            <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                <lightning-button
                    label="Cancelar"
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>

                <lightning-button
                    type="submit"
                    label="Guardar"
                    variant="brand">
                </lightning-button>
            </div>
        </lightning-record-edit-form>
    </lightning-modal-body>
</template>
